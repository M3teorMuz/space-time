name: Build SPACE-TIME (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --target SPACE_TIME_VST3 SPACE_TIME_Standalone --parallel

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/SPACE_TIME_artefacts/Release/VST3" "dist/VST3"
          Copy-Item -Recurse -Force "build/SPACE_TIME_artefacts/Release/Standalone" "dist/Standalone"
          Get-ChildItem -Recurse dist | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: SPACE-TIME-Windows
          path: dist
